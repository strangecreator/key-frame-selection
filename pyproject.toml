[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "key_frame_selection"
version = "2.0.0"
description = "Key frame selection tool optimized for FindingDory dataset."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.24",
  "opencv-python>=4.8",
  "tqdm>=4.66",
]

[project.optional-dependencies]
viz = [
  "matplotlib>=3.8",
]
dev = [
  "pytest>=7.0.0",
  "pytest-cov>=4.0.0",
  "pytest-timeout>=2.0.0",
  "ruff>=0.4.0",
  "mypy>=1.8.0",
]

[tool.setuptools]
package-dir = { "key_frame_selection" = "src" }
packages = ["key_frame_selection"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
timeout = 360